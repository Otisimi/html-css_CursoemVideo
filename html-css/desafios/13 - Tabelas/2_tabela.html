<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela matérias</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      table {
        border-collapse: collapse;
      }
      td,
      th {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
      }
      .materia {
        text-align: justify;
      }
      .head {
        background-color: grey;
        color: white;
      }
      .headTotal {
        background-color: grey;
        color: white;
        text-align: justify;
      }
      .dadoTotal{
        background-color: grey;
        color: white;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th class="head" rowspan="2" scope="col" >Área</th>
          <th class="head" rowspan="2" scope="col">Disciplinas</th>
          <th class="head" colspan="2" scope="colgroup">Nota</th>
          <th class="head" rowspan="2" scope="col">Média</th>
        </tr>
        <tr>
          <th class="head" scope="col">Nota 1</th>
          <th class="head" scope="col">Nota 2</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th class="area" rowspan="4" scope="rowgroup">Exatas</th>
          <td class="materia" scope="row">Matemática</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr>
          <td class="materia" scope="row">Física</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr>
          <td class="materia" scope="row">Química</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr>
          <td class="materia" scope="row">Biologia</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <th class="headTotal" colspan="4">Média Exatas</th>
        <th class="head">0.0</th>
        <tr>
          <th class="area" rowspan="2" scope="rowgroup">Humanas</th>
          <td class="materia" scope="row">História</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <tr>
          <td class="materia" scope="row">Geografia</td>
          <td>0.0</td>
          <td>0.0</td>
          <td>0.0</td>
        </tr>
        <th class="headTotal" colspan="4">Média Exatas</th>
        <td class="dadoTotal">0.0</th>
      </tbody>
    </table>
  </body>
</html>
