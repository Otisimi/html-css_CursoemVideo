<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redes Sociais</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main>
      <section id="telefone">
        <iframe
          srcdoc="<img src='imagens/tela-home.jpg'/>"
          name="frame-phone"
          frameborder="0"
        ></iframe>
      </section>

      <section id="redes_sociais">
        <div>
          <a href="imagens/tela-home.jpg" target="frame-phone"
            ><img src="imagens/logo-home.jpg" alt="Home Icon"
          /></a>
          <a href="imagens/tela-facebook.jpg" target="frame-phone"
            ><img src="imagens/logo-facebook.jpg" alt="Facebook Icon"
          /></a>
          <a href="imagens/tela-github.jpg" target="frame-phone"
            ><img src="imagens/logo-github.jpg" alt="Git Icon"
          /></a>
          <a href="imagens/tela-instagram.jpg" target="frame-phone"
            ><img src="imagens/logo-instagram.jpg" alt="Instagram Icon"
          /></a>
          <a href="imagens/tela-twitter.jpg" target="frame-phone"
            ><img src="imagens/logo-twitter.jpg" alt="Twitter Icon"
          /></a>
          <a href="imagens/tela-youtube.png" target="frame-phone"
            ><img src="imagens/logo-youtube.jpg" alt="Youtube Icon"
          /></a>
        </div>
      </section>

</html>
