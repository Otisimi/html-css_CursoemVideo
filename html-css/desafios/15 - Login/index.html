<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css" />
    <link rel="stylesheet" href="estilos/media-query.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <section id="login">
        <div id="fundo"></div>
        <div id="cadastro">
          <h1>Login</h1>
          <p>
            Seja bem-vindo(a) novamente. Faça login para acessar sua conta e
            poder fazer as configuraçãos no seu ambiente
          </p>
          <form action="login.js" method="post">
            <div class="campo">
              <span class="material-icons"> account_circle </span>
              <input
                type="email"
                name="email"
                id="iemail"
                placeholder="seu e-mail"
                autocomplete="email"
                required
                maxlength="30"
              />
              <label for="iemail">E-mail</label>
            </div>
            <div class="campo">
              <span class="material-icons"> https </span>
              <input
                type="password"
                name="senha"
                id="isenha"
                placeholder="sua senha"
                autocomplete="current-password"
                required
                minlength="8"
                maxlength="16"
              />
              <label for="isenha">Senha</label>
            </div>
            <input type="submit" value="Entrar" />
            <a href="esqueci.html"
              >Esqueci a senha
              <span class="material-icons"> lock_reset </span></a
            >
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
