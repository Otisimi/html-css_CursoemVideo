<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout</title>
    <style>
      .container {
        display: grid;
        grid-template: repeat(15, 50px) / 4fr 1fr;
        gap: 5px;
      }
      .container > div {
        border: 2px dashed purple;
        padding: 10px;
        text-align: center;
      }
      .topo {
        grid-area: 1 / 1 / 3 / -1;
      }
      .menu {
        grid-area: 3 / 1 / 4 / -1;
      }
      .principal {
        grid-area: 4 / 1 / -2 / 2;
      }
      .secundario {
        grid-area: 4 / 2 / -2 / -1;
      }
      .rodape {
        grid-area: -2 / 1 / -1 / -1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topo">Topo</div>
      <div class="menu">Menu</div>
      <div class="principal">Principal</div>
      <div class="secundario">Secundário</div>
      <div class="rodape">Rodapé</div>
    </div>
  </body>
</html>
