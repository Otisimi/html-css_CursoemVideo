<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tamanhos de imagens</title>
  </head>
  <body>
    <h1>Imagem dinâmica</h1>
    <p>Essa imagem é adaptável ao tamanho da tela</p>

    <picture>
      <source
        media="(max-width: 750px)"
        srcset="imagens/foto_p.png"
        type="image/png"
      />
      <source
        media="(max-width: 1050px)"
        srcset="imagens/foto_m.png"
        type="image/png"
      />
      <img src="imagens/foto_g.png" alt="Foto 1000x1000" />
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>AAAPERTA O PLAY NEYMÁ</p>
    <audio controls preload="metadata">
      <source src="midia/reggae_dubom.mp3" type="audio/mpeg" />
      <source src="midia/reggae_dubom.ogg" type="audio/ogg" />
      <source src="midia/reggae_dubom.wav" type="audio/wav" />
      <p>
        Infelizmente seu navegador não consegue reproduzir
        <a href="midia/reggae_dubom.mp3"><u>Clique para baixá-lo!</u></a>
      </p>
    </audio>
  </body>
</html>
