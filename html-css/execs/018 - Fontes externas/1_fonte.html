<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fontes Externas</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fontdiner+Swanky&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Nabla&display=swap");
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        color: black;
        background-color: rgb(143, 85, 31);
      }
      h1 {
        font-family: Nabla;
        font-size: 3em;
      }
      p {
        font-family: "Fontdiner Swanky", Caveat;
        font-size: 1.5em;
        color: bisque;
      }
    </style>
  </head>
  <body>
    <h1>Fontes com Google Fonts</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolore,
      obcaecati. Eos fugiat earum officiis est cumque deserunt eum corrupti?
      Odit suscipit dolorem, quibusdam excepturi repellendus harum quidem neque
      ea in.
    </p>
  </body>
</html>
