<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fontes Externas</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fontdiner+Swanky&display=swap");
      @font-face {
        font-family: RioGrande;
        src:
          url(RioGrande.ttf) format("truetype"),
          url(RioGrande\ Striped.ttf) format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: rgb(253, 253, 106);
      }
      h1 {
        font-family: RioGrande;
        font-size: 3em;
        color: rgb(141, 61, 3);
      }
      p {
        font-family: Caveat;
        font-size: 2em;
        color: rgb(236, 72, 12);
        font-weight: bolder;
      }
    </style>
  </head>
  <body>
    <h1>(Titulo de Fonte)</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Temporibus
      veritatis exercitationem repudiandae provident. Perspiciatis, magnam sed.
      Quod commodi ullam a sit, eaque vel perspiciatis sint sequi consequuntur
      reprehenderit, culpa accusamus.
    </p>
  </body>
</html>
