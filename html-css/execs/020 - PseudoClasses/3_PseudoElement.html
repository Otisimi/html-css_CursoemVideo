<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personalizando Links</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      a {
        color: rgb(255, 45, 45);
        text-decoration: none;
        font-weight: bold;
      }
      a:visited {
        color: darkred;
      }
      a:hover {
        color: red;
        text-decoration: underline;
      }
      a:active {
        color: rgb(102, 185, 212);
      }
      a::after {
        content: "[link]";
        text-decoration: none;
        font-weight: normal;
        color: lightcoral;
      }
      .youtube{
        background-color: rgb(250, 194, 194);
      }
      .youtube::before {
        content: "✅";
      }
    </style>
  </head>
  <body>
    <h1>Personalizando Links</h1>
    <ul>
      <li>
        <a href="https://github.com/otisimi" target="_blank" rel="external"
          >Repositório GitHub</a
        >
      </li>
      <li>
        <a
          class="youtube"
          href="https://www.youtube.com/"
          target="_blank"
          rel="external"
          >Youtube</a
        >
      </li>
      <li>
        <a href="https://pointerpointer.com/" target="_blank" rel="external"
          >Pointer pointer</a
        >
      </li>
    </ul>
  </body>
</html>
