<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      table {
        height: 400px;
        width: 400px;
        border-collapse: collapse;
      }
      td {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <h1>Minha primeira tabela</h1>
    <table>
      <!-- Linha -->
      <tr>
        <!-- Dados -->
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>
      </tr>
      <!-- Linha 2 -->
      <tr>
        <!-- Dados -->
        <td>A2</td>
        <td>B2</td>
        <td class="numero">C2</td>
      </tr>
      <!-- Linha 3 -->
      <tr>
        <!-- Dados -->
        <td>A3</td>
        <td>B3</td>
        <td class="numero">C3</td>
      </tr>
      <!-- Linha 4 -->
      <tr>
        <!-- Dados -->
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
      </tr>
    </table>
  </body>
</html>
