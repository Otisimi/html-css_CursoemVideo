<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      table {
        border-collapse: collapse;
        width: 500px;
      }
      caption {
        font-size: 1.3rem;
        font-weight: bold;
        padding: 8px;
      }
      th,
      td {
        border: 1px solid black;
        padding: 8px;
      }
      .cnome {
        background-color: aquamarine;
      }
      .cgrupo {
        background-color: plum;
      }
      .cprofi{
        background-color: coral;
      }
    </style>
  </head>
  <body>
    <table>
      <colgroup>
        <col class="cnome" />
        <col class="cgrupo" span="2" />
        <col class="cprofi" />
      </colgroup>
      <caption>
        Cadastro
      </caption>
      <tr>
        <th scope="col">Nome</th>
        <th scope="col">Sexo</th>
        <th scope="col">Idade</th>
        <th scope="col">Profissão</th>
      </tr>
      <tr>
        <td>Ana Maria</td>
        <td>F</td>
        <td>25</td>
        <td>Jornalista</td>
      </tr>
      <tr>
        <td>José Antônio</td>
        <td>M</td>
        <td>32</td>
        <td>Marinheiro</td>
      </tr>
      <tr>
        <td>Laura Ashen</td>
        <td>F</td>
        <td>20</td>
        <td>Nutricionista</td>
      </tr>
      <tr>
        <td>Clara Prado</td>
        <td>F</td>
        <td>26</td>
        <td>Médica</td>
      </tr>
      <tr>
        <td>Paulo Ricardo</td>
        <td>M</td>
        <td>53</td>
        <td>Músico</td>
      </tr>
      <tr>
        <td>Otávio Cohen</td>
        <td>M</td>
        <td>23</td>
        <td>Desenvolvedor</td>
      </tr>
    </table>
  </body>
</html>
