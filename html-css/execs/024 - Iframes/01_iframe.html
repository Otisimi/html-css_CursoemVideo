<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iframes</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      iframe {
        width: 600px;
        height: 600px;
        border: 1px solid rgb(174, 34, 34);
      }
    </style>
  </head>
  <body>
    <h1>Testando Iframes</h1>
    <p>
      Acessando o site do

      <iframe
        src="https://jovemnerd.com.br/podcasts/nerdcast"
        frameborder="0"
        height="500px"
        width="500px"
      >
        <a href="https://jovemnerd.com.br/podcasts/nerdcast" target="_blank"
          >Nerdcast</a
        >
      </iframe>

      para ouvir nerdcast :D
    </p>

    <p>
      O site do
      <iframe
        src="https://otisimi.github.io/html-css_CursoemVideo/"
        frameborder="0"
        width="700px"
        scrolling="no"
      >
        <a
          href="https://otisimi.github.io/html-css_CursoemVideo/"
          target="_blank"
          >MEU SITE</a
        >
      </iframe>
      tbm é muito show
    </p>
  </body>
</html>
