<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      div.conteiner {
        background-color: lightyellow;

        display: flex;
        flex-flow: row wrap;
      }
      div.item {
        background-color: lightblue;
        border: 1px solid darkcyan;
        padding: 20px;
        text-align: center;
      }

      div#iA {
        order: 0;
      }
      div#iB {
        order: -2;
      }
      div#iC {
        order: 4;
      }
      div#iD {
        order: 7;
      }
      div#iE {
        order: -1;
      }
      div#iF {
        order: 2;
      }
      div#iG {
        order: 2;
      }
    </style>
  </head>
  <body>
    <h1>Flexible Box</h1>
    <div class="conteiner">
      <div class="item" id="iA">A</div>
      <div class="item" id="iB">B</div>
      <div class="item" id="iC">C</div>
      <div class="item" id="iD">D</div>
      <div class="item" id="iE">E</div>
      <div class="item" id="iF">F</div>
      <div class="item" id="iG">G</div>
    </div>
  </body>
</html>
