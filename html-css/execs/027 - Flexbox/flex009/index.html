<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      div.conteiner {
        background-color: lightyellow;

        display: flex;
        flex-flow: row wrap;
      }
      div.item {
        background-color: lightblue;
        border: 1px solid darkcyan;
        text-align: center;
        flex-basis: 150px;
      }
    </style>
  </head>
  <body>
    <h1>Flexible Box</h1>
    <div class="conteiner">
      <div class="item">A</div>
      <div class="item">Maior B</div>
      <div class="item">C</div>
      <div class="item">Maioral que o outro D</div>
      <div class="item">E</div>
      <div class="item">O Maior de todos os outros miseráveis F</div>
      <div class="item">G</div>
    </div>
  </body>
</html>
