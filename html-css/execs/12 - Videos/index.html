<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vídeos</title>
  </head>
  <body>
    <h1>Vídeos Hospedades</h1>
    <p>Este vídeo está no meu próprio servidor</p>

    <video
      width="500"
      poster="imagens/cucu.jpg"
      preload="metadata"
      controls
      autoplay
      muted
    >
      <source src="midia/baloes_720.mp4" type="video/mp4" />
      <source src="midia/baloes_1080.mp4" type="video/mp4" />
      <source src="midia/baloes_w720w.webm" type="video/webm" />
      <p>Seu navegador não consegue reproduzir o vídeo :&lpar;</p>
    </video>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/pAGrykAxkB4?si=TPotF9tACeZzFMly"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
