<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradiente em CSS</title>
    <style>
      * {
        /* Configurações globais da CSS */
        height: 100%;
      }
      body {
        background-image: linear-gradient(
          to bottom,
          #a3a1d1,
          #9458ae,
          #40415f
        ); /* 90deg --> em graus, ao inves do to right, funciona tbm */
        background-attachment: fixed;
      }
      /* body {
        background-image: radial-gradient(circle, #a3a1d1, #9458ae, #40415f);
      } */
    </style>
  </head>
  <body>
    <h1>Testando Gradiente</h1>
  </body>
</html>
