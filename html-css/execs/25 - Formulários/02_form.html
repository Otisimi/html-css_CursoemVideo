<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: steelblue;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.js" method="post" autocomplete="on">
      <p>
        <label for="iusu">Usuário:</label>
        <input
          type="text"
          name="usuario"
          id="iusu"
          required
          minlength="3"
          maxlength="50"
          placeholder="Nome"
          autocomplete="username"
        />
      </p>
      <p>
        <label for="isenha">Senha:</label>
        <input
          type="password"
          name="senha"
          id="isenha"
          required
          minlength="7"
          maxlength="15"
          placeholder="Senha"
          autocomplete="current-password"
        />
      </p>
      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>
  </body>
</html>
