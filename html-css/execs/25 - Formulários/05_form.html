<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.js" method="get" autocomplete="on">
      <fieldset>
        <legend>Sexo</legend>
        <input type="radio" name="Sexo" id="imasc" checked /><label for="imasc"
          >Masculino</label
        >
        <input type="radio" name="Sexo" id="ifem" /><label for="ifem"
          >Feminino</label
        >
      </fieldset>
      <fieldset>
        <legend>Esportes Favoritos</legend>
        <input type="checkbox" name="esfut" id="iesfut" checked />
        <label for="iesfut">Futebol</label><br />
        <input type="checkbox" name="esbas" id="iesbas" />
        <label for="iesbas"> Basquete </label><br />
        <input type="checkbox" name="esvol" id="iesvol" />
        <label for="iesvol"> Vôlei </label><br />
        <input type="checkbox" name="esf1" id="iesf1" checked />
        <label for="iesf1"> Fórmula 1 </label><br />
      </fieldset>

      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>
  </body>
</html>
